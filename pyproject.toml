[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "arc-scheduler"
version = "1.0.0"
description = "Versioned production scheduling engine for ARC"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["arc_scheduler*"]
